[project]
name = "ios-bridge"
version = "0.1.0"
description = "MCP server that lets an LLM connect to and configure Cisco IOS routers"
readme = "README.md"
authors = [
    { name = "Jarek", email = "9482128+xawt@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ios-bridge = "ios_bridge:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
    "ty>=0.0.83",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
